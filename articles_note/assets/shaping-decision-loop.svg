<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Shaping is a decision loop</title>
  <desc id="desc">Shape, Build, Verify, Learn の結果を Decide して次の Shape に戻す循環図</desc>
  <rect width="1280" height="720" fill="#f8f8f6"/>
  <style>
    text { font-family: Inter, "Noto Sans JP", system-ui, sans-serif; }
    .title { font-size: 52px; font-weight: 700; fill: #191919; }
    .sub { font-size: 26px; fill: #666; }
    .label { font-size: 30px; font-weight: 700; fill: #191919; }
    .shape { fill: #354f42; }
    .tag { font-size: 18px; font-weight: 700; fill: #777; }
    .decision { font-size: 23px; font-weight: 700; fill: #354f42; letter-spacing: 1px; }
  </style>
  <text x="90" y="120" class="title">Shaping is a decision loop</text>
  <text x="92" y="162" class="sub">Evidence changes the next scope and specification.</text>

  <text x="120" y="250" class="tag">Outcome</text>
  <text x="245" y="250" class="tag">Scope</text>
  <text x="360" y="250" class="tag">Trade-off</text>
  <text x="505" y="250" class="tag">Stop</text>

  <g transform="translate(120 300)">
    <rect x="0" y="0" width="195" height="105" rx="26" fill="#e8eeea" stroke="#354f42" stroke-width="3"/>
    <text x="97.5" y="65" text-anchor="middle" class="label shape">Shape</text>

    <line x1="205" y1="52" x2="253" y2="52" stroke="#666" stroke-width="4"/>
    <path d="M253 52 l-13 -9 M253 52 l-13 9" fill="none" stroke="#666" stroke-width="4"/>

    <rect x="265" y="0" width="195" height="105" rx="26" fill="#fff" stroke="#bebeb8" stroke-width="2"/>
    <text x="362.5" y="65" text-anchor="middle" class="label">Build</text>

    <line x1="470" y1="52" x2="518" y2="52" stroke="#666" stroke-width="4"/>
    <path d="M518 52 l-13 -9 M518 52 l-13 9" fill="none" stroke="#666" stroke-width="4"/>

    <rect x="530" y="0" width="195" height="105" rx="26" fill="#fff" stroke="#bebeb8" stroke-width="2"/>
    <text x="627.5" y="65" text-anchor="middle" class="label">Verify</text>

    <line x1="735" y1="52" x2="783" y2="52" stroke="#666" stroke-width="4"/>
    <path d="M783 52 l-13 -9 M783 52 l-13 9" fill="none" stroke="#666" stroke-width="4"/>

    <rect x="795" y="0" width="195" height="105" rx="26" fill="#fff" stroke="#bebeb8" stroke-width="2"/>
    <text x="892.5" y="65" text-anchor="middle" class="label">Learn</text>

    <path d="M892 135 v110 H100 v-110" fill="none" stroke="#354f42" stroke-width="4"/>
    <path d="M100 135 l-10 14 M100 135 l10 14" fill="none" stroke="#354f42" stroke-width="4"/>
    <text x="496" y="280" text-anchor="middle" class="decision">DECIDE → NEXT SHAPE</text>
  </g>
</svg>
