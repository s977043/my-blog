<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Optimize Time to Learning</title>
  <desc id="desc">Problem から Next decision までの全体を Time to Learning、Build 部分だけを Time to Code と示す図</desc>
  <rect width="1280" height="720" fill="#f8f8f6"/>
  <style>
    text { font-family: Inter, "Noto Sans JP", system-ui, sans-serif; }
    .title { font-size: 52px; font-weight: 700; fill: #191919; }
    .sub { font-size: 26px; fill: #666; }
    .label { font-size: 21px; font-weight: 700; fill: #191919; }
    .build { fill: #354f42; }
    .caption { font-size: 20px; font-weight: 700; fill: #354f42; }
    .overall { font-size: 27px; font-weight: 700; fill: #191919; }
  </style>
  <text x="90" y="120" class="title">Optimize Time to Learning</text>
  <text x="92" y="162" class="sub">Build speed matters. The whole learning loop matters more.</text>

  <g transform="translate(70 310)">
    <rect x="0" y="0" width="145" height="86" rx="22" fill="#fff" stroke="#bebeb8" stroke-width="2"/>
    <text x="72.5" y="54" text-anchor="middle" class="label">Problem</text>
    <line x1="150" y1="43" x2="173" y2="43" stroke="#666" stroke-width="3"/><path d="M173 43 l-10 -7 M173 43 l-10 7" fill="none" stroke="#666" stroke-width="3"/>

    <rect x="181" y="0" width="175" height="86" rx="22" fill="#fff" stroke="#bebeb8" stroke-width="2"/>
    <text x="268.5" y="54" text-anchor="middle" class="label">Hypothesis</text>
    <line x1="361" y1="43" x2="384" y2="43" stroke="#666" stroke-width="3"/><path d="M384 43 l-10 -7 M384 43 l-10 7" fill="none" stroke="#666" stroke-width="3"/>

    <rect x="392" y="0" width="135" height="86" rx="22" fill="#fff" stroke="#bebeb8" stroke-width="2"/>
    <text x="459.5" y="54" text-anchor="middle" class="label">Shape</text>
    <line x1="532" y1="43" x2="555" y2="43" stroke="#666" stroke-width="3"/><path d="M555 43 l-10 -7 M555 43 l-10 7" fill="none" stroke="#666" stroke-width="3"/>

    <rect x="563" y="0" width="145" height="86" rx="22" fill="#e8eeea" stroke="#354f42" stroke-width="3"/>
    <text x="635.5" y="54" text-anchor="middle" class="label build">Build</text>
    <line x1="713" y1="43" x2="736" y2="43" stroke="#666" stroke-width="3"/><path d="M736 43 l-10 -7 M736 43 l-10 7" fill="none" stroke="#666" stroke-width="3"/>

    <rect x="744" y="0" width="155" height="86" rx="22" fill="#fff" stroke="#bebeb8" stroke-width="2"/>
    <text x="821.5" y="54" text-anchor="middle" class="label">Evidence</text>
    <line x1="904" y1="43" x2="927" y2="43" stroke="#666" stroke-width="3"/><path d="M927 43 l-10 -7 M927 43 l-10 7" fill="none" stroke="#666" stroke-width="3"/>

    <rect x="935" y="0" width="185" height="86" rx="22" fill="#fff" stroke="#bebeb8" stroke-width="2"/>
    <text x="1027.5" y="54" text-anchor="middle" class="label">Next decision</text>

    <line x1="563" y1="135" x2="708" y2="135" stroke="#354f42" stroke-width="4"/>
    <line x1="563" y1="125" x2="563" y2="145" stroke="#354f42" stroke-width="4"/>
    <line x1="708" y1="125" x2="708" y2="145" stroke="#354f42" stroke-width="4"/>
    <text x="635.5" y="178" text-anchor="middle" class="caption">Time to Code</text>

    <line x1="0" y1="265" x2="1120" y2="265" stroke="#191919" stroke-width="4"/>
    <line x1="0" y1="255" x2="0" y2="275" stroke="#191919" stroke-width="4"/>
    <line x1="1120" y1="255" x2="1120" y2="275" stroke="#191919" stroke-width="4"/>
    <text x="560" y="315" text-anchor="middle" class="overall">Time to Learning</text>
  </g>
</svg>
