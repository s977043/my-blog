<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#fff"/><style>.t{font-family:'Noto Sans JP','Hiragino Sans',sans-serif;fill:#111827}.h{font-size:56px;font-weight:700}.s{font-size:30px}.n{font-size:34px;font-weight:700}.b{stroke:#475569;stroke-width:3;rx:24}.a{stroke:#475569;stroke-width:5;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#475569"/></marker></defs><text x="90" y="95" class="t h">Loop：改善の単位</text><text x="90" y="150" class="t s">一つの仕事を、検証結果に応じて修正し、完了条件まで収束させる</text><rect x="575" y="235" width="450" height="125" fill="#e0f2fe" class="b"/><text x="800" y="290" text-anchor="middle" class="t n">Plan</text><text x="800" y="330" text-anchor="middle" class="t s">計画</text><rect x="1090" y="430" width="330" height="125" fill="#dcfce7" class="b"/><text x="1255" y="485" text-anchor="middle" class="t n">Work</text><text x="1255" y="525" text-anchor="middle" class="t s">実行</text><rect x="575" y="635" width="450" height="125" fill="#fef3c7" class="b"/><text x="800" y="690" text-anchor="middle" class="t n">Verify</text><text x="800" y="730" text-anchor="middle" class="t s">検証</text><rect x="180" y="430" width="330" height="125" fill="#f3e8ff" class="b"/><text x="345" y="485" text-anchor="middle" class="t n">Improve</text><text x="345" y="525" text-anchor="middle" class="t s">修正</text><path d="M1025 300 C1160 310 1240 350 1255 430" class="a"/><path d="M1255 555 C1235 650 1110 700 1025 700" class="a"/><path d="M575 700 C455 690 360 630 345 555" class="a"/><path d="M345 430 C360 350 455 305 575 300" class="a"/><text x="800" y="505" text-anchor="middle" class="t n">NGなら戻る</text><path d="M1025 700 L1390 700" class="a"/><text x="1410" y="710" class="t n">OK → Done</text><text x="90" y="840" class="t s">Loopは「どのように改善し続けるか」を設計する。再試行上限・停止条件・完了の証拠も含む。</text></svg>