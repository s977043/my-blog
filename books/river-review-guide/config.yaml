title: "AIエージェント時代のレビューを設計する — River Review 実践ガイド"
summary: "AIでコードを書く速度は上がったのに、「この変更を通してよいか」の判断が追いつかない。そんなチームに向けて、レビューの観点と判断基準をチームの資産として持ち、機械・AI・人のどこで判断するかを決める方法を、OSSのRiver Reviewを題材に解説する。すぐ試したい人は第4部の「最初のRiver Reviewを実行する」から読める。全7部・本編33章と付録。"
