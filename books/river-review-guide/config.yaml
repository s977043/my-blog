title: "AIエージェント時代のレビューを設計する — River Review 実践ガイド"
summary: "AIによってコードを書く速度が上がるほど、何を確認し、何を根拠に、誰が判断するかが重要になる。本書ではRiver Reviewを題材に、Review Judgment as Code、Artifact、Evidence、Skill、Judgment Placement、Human Judgment、Review Coverage、Memory、Evaluationを体系的に解説し、チームのレビュー判断を再利用・検証・改善できる仕組みを扱う。"
