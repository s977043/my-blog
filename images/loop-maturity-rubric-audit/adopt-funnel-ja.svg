  <text x="216" y="668" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="26" font-weight="800" fill="#142033">自動化されたのは起票まで。取捨選択はそのまま人間に転嫁されていた</text>
  <text x="216" y="712" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="21" font-weight="400" fill="#475569">足切り基準を入れて初めて、人間の判断が「5 件のうちどれをやるか」に縮んだ。</text>
  <text x="216" y="746" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="21" font-weight="400" fill="#475569">自動化の設計で決めるべきなのは、何を自動化するかよりも、人間に何件届けるかのほうだった。</text>
