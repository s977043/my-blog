name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Content checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          # check:zenn-pace が過去 24h の commit を走査するため全履歴を取得する
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # 新設 check スクリプトの初版バグ対策（#393/#417 の再発防止）として、
      # self-test を持つ check スクリプトは原則すべてここで常時実行する。
      # いずれも fixture ベースの hermetic テストで、ローカル実測 1 本あたり 0.4-0.8 秒。
      # test:article-humanizer は contract / language-density の複合スクリプト。
      - name: Content harness self-tests
        run: |
          npm run test:article-humanizer
          npm run test:note-finalize
          npm run test:note-thesis-snapshot
          npm run test:zenn-image-format
          npm run test:zenn-book-structure
          npm run test:zenn-book-template
          npm run test:zenn-book-writing-contract
          npm run test:zenn-book-browser
          npm run test:changed-zenn-books
          npm run test:note-setext
          npm run test:queue-drift
          npm run test:orphan-docs
          npm run test:clean-note-build
          npm run test:learnings-index
          npm run test:suggest-theme
          npm run test:note-cover-image
          npm run test:pr-conflict
          npm run test:article-sentence-style
          npm run test:article-seed-placeholders
          npm run test:article-plan
          npm run test:article-graph
          npm run test:channel-metrics-link
          npm run test:note-wxr
          npm run test:reader-review-targets
          npm run test:due
          npm run test:talk

      # check:pr-staleness の self-test。bash + 一時 git リポジトリを作るため
      # 他の self-test より重い（ローカル実測 6.0 秒 / exit 0）が、CI 全体の
      # ジョブ時間（timeout-minutes: 10）に対しては十分軽いので常時実行する。
      # 分離しているのは、失敗時に「git fixture 起因か content 起因か」を
      # ステップ名だけで切り分けられるようにするため。
      - name: PR staleness harness self-test
        run: npm run test:pr-staleness

      # cleanup-pr-worktree.sh（PR マージ後のローカル後片付け）の self-test。
      # #606 の「self-test を持つ check スクリプトは CI で常時実行する」方針の対象。
      # 16 fixture 分の一時 git リポジトリ + worktree を作るため self-test 中では最も重い
      # （ローカル実測 22 秒 / exit 0。うち約 4 秒は中断シグナル回帰ケースの意図的な待機）。
      # それでもジョブの timeout-minutes: 10 に対しては十分軽いので常時実行する。
      - name: PR cleanup harness self-test
        run: npm run test:cleanup-pr
      - name: Merged branch sweep self-test
        run: npm run test:clean-merged-branches
      - name: release/zenn sync self-test
        run: npm run test:sync-release-zenn
      - name: gh account guard hook self-test
        run: npm run test:gh-guard

      # npm run check は複数の検査を「全件実行してから失敗をまとめて報告」する
      # 集約ランナー。以前は && チェーンだったため、前方の 1 件が落ちると後続が
      # 一度も実行されず、1 回の CI で分かることが最初の失敗だけに縮んでいた
      # （PR #605 で check:learnings-index が初めてブロッキングになり、後続 6 件が
      # 未実行になった実例）。個々の検査の合否判定は変えていない。
      - name: Check Zenn content
        run: npm run check

      # Zenn CLI の実レンダリング経路を最低限 smoke test する。
      # 見た目の良し悪しは人間の preview review に残し、ここでは
      # server 起動 / Book route / Book title の3点だけを自動検証する。
      - name: Smoke test River Review Book preview
        run: |
          set -euo pipefail
          ./node_modules/.bin/zenn preview --no-watch --port 8000 > /tmp/zenn-preview.log 2>&1 &
          preview_pid=$!

          cleanup_preview() {
            kill "$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup_preview EXIT

          ok=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error               http://127.0.0.1:8000/books/river-review-guide               --output /tmp/river-review-book.html; then
              ok=1
              break
            fi
            sleep 1
          done

          if [ "$ok" -ne 1 ]; then
            cat /tmp/zenn-preview.log
            exit 1
          fi

          test -s /tmp/river-review-book.html

          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.63.0
          CHROME_PATH="$CHROME_PATH" ZENN_PREVIEW_URL="http://127.0.0.1:8000" \
            npm run check:river-review-book-browser

          cleanup_preview
          trap - EXIT

      - name: Upload River Review Book browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: river-review-book-browser-evidence
          path: artifacts/zenn-book-browser
          if-no-files-found: warn
          retention-days: 7

      # release/zenn 宛 PR のみ: base との差分から変更された published:true Book を抽出する。
      # draft / removed Book はbrowser対象外。検出結果は後続stepへ明示的に渡す。
      - name: Detect changed published Zenn Books
        id: changed_zenn_books
        if: github.event_name == 'pull_request' && github.base_ref == 'release/zenn'
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}"

          BASE_REF="origin/${{ github.base_ref }}" npm run --silent list:changed-zenn-books \
            > /tmp/changed-zenn-books.txt

          if [ -s /tmp/changed-zenn-books.txt ]; then
            echo "has_books=true" >> "$GITHUB_OUTPUT"
            echo "[zenn-book-browser] changed published Books:"
            sed 's/^/  - /' /tmp/changed-zenn-books.txt
          else
            echo "has_books=false" >> "$GITHUB_OUTPUT"
            echo "[zenn-book-browser] no changed published Books"
          fi

      - name: Browser check changed published Zenn Books
        if: github.event_name == 'pull_request' && github.base_ref == 'release/zenn' && steps.changed_zenn_books.outputs.has_books == 'true'
        run: |
          set -euo pipefail
          mapfile -t changed_books < /tmp/changed-zenn-books.txt

          ./node_modules/.bin/zenn preview --no-watch --port 8000 > /tmp/zenn-preview-books.log 2>&1 &
          preview_pid=$!

          cleanup_preview() {
            kill "$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup_preview EXIT

          ok=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/ --output /tmp/zenn-preview-books.html; then
              ok=1
              break
            fi
            sleep 1
          done

          if [ "$ok" -ne 1 ]; then
            cat /tmp/zenn-preview-books.log
            exit 1
          fi

          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"

          npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.63.0

          for book in "${changed_books[@]}"; do
            CHROME_PATH="$CHROME_PATH" ZENN_PREVIEW_URL="http://127.0.0.1:8000" \
              npm run check:zenn-book-browser -- \
                --book "$book" \
                --artifact-dir "artifacts/release-zenn-book-browser/$book"
          done

          cleanup_preview
          trap - EXIT

      - name: Upload changed Zenn Book browser evidence
        if: always() && github.event_name == 'pull_request' && github.base_ref == 'release/zenn' && steps.changed_zenn_books.outputs.has_books == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: changed-zenn-book-browser-evidence
          path: artifacts/release-zenn-book-browser
          if-no-files-found: error
          retention-days: 7

      # publish-readiness ゲートの fixture self-test（hermetic・git 不要）。
      # 新設 check スクリプトの初版バグ対策（#393/#417 の再発防止）として常時実行する。
      - name: Publish readiness self-test
        run: npm run test:publish-readiness

      # zenn-pace ゲート自身の self-test（純関数 + 一時 git リポジトリによる hermetic テスト）。
      # 上と同じ趣旨（新設 check スクリプトの初版バグ対策・#393/#417 の再発防止）で常時実行する。
      # これを入れないと「rate-limit を見逃す変異」を CI が一度も検出できない（PR #553 レビュー M-2）。
      # ZENN_PACE_NO_FETCH=1: fixture は一時リポジトリなのでネットワーク fetch を抑止する。
      - name: Zenn publish pace self-test
        env:
          ZENN_PACE_NO_FETCH: '1'
        run: npm run test:zenn-pace

      # release/zenn 宛 PR のみ: この PR が release/zenn に新規に持ち込む published 数を
      # diff モード(BASE_REF)で直接計測し、二重公開(同一 deploy/24h で 2 記事)を STRICT で fatal 化する。
      # date モード(コミット日付)は「溜めてから sync」運用で見逃す/誤ブロックするため base 比較で計測する。
      - name: Zenn publish pace gate (release/zenn PRs only)
        if: github.event_name == 'pull_request' && github.base_ref == 'release/zenn'
        run: |
          git fetch origin "${{ github.base_ref }}"
          STRICT=1 BASE_REF="origin/${{ github.base_ref }}" npm run check:zenn-pace

      # release/zenn 宛 PR のみ: この PR で公開/更新される published:true 記事の
      # publish-readiness（/review-improve-loop の最終判定）を検証する（P5 ゲート）。
      # 段階導入のため STRICT なし（blocked=true でも WARN 止まり）。誤検知率を見て STRICT=1 に上げる。
      # 設計: docs/publish-readiness-gate-design.md
      - name: Publish readiness gate (release/zenn PRs only, WARN phase)
        if: github.event_name == 'pull_request' && github.base_ref == 'release/zenn'
        run: |
          git fetch origin "${{ github.base_ref }}"
          BASE_REF="origin/${{ github.base_ref }}" npm run check:publish-readiness

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
