name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Content checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          # check:zenn-pace が過去 24h の commit を走査するため全履歴を取得する
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # 新設 check スクリプトの初版バグ対策（#393/#417 の再発防止）として、
      # self-test を持つ check スクリプトは原則すべてここで常時実行する。
      # いずれも fixture ベースの hermetic テストで、ローカル実測 1 本あたり 0.4-0.8 秒。
      # test:article-humanizer は contract / language-density の複合スクリプト。
      - name: Content harness self-tests
        run: |
          npm run test:article-humanizer
          npm run test:note-finalize
          npm run test:note-thesis-snapshot
          npm run test:zenn-image-format
          npm run test:note-setext
          npm run test:queue-drift
          npm run test:orphan-docs
          npm run test:clean-note-build
          npm run test:learnings-index
          npm run test:suggest-theme
          npm run test:note-cover-image
          npm run test:pr-conflict
          npm run test:article-sentence-style
          npm run test:article-graph
          npm run test:channel-metrics-link

      # check:pr-staleness の self-test。bash + 一時 git リポジトリを作るため
      # 他の self-test より重い（ローカル実測 6.0 秒 / exit 0）が、CI 全体の
      # ジョブ時間（timeout-minutes: 10）に対しては十分軽いので常時実行する。
      # 分離しているのは、失敗時に「git fixture 起因か content 起因か」を
      # ステップ名だけで切り分けられるようにするため。
      - name: Check article graph projection
        run: npm run check:article-graph

      - name: PR staleness harness self-test
        run: npm run test:pr-staleness

      # cleanup-pr-worktree.sh（PR マージ後のローカル後片付け）の self-test。
      # #606 の「self-test を持つ check スクリプトは CI で常時実行する」方針の対象。
      # 16 fixture 分の一時 git リポジトリ + worktree を作るため self-test 中では最も重い
      # （ローカル実測 22 秒 / exit 0。うち約 4 秒は中断シグナル回帰ケースの意図的な待機）。
      # それでもジョブの timeout-minutes: 10 に対しては十分軽いので常時実行する。
      - name: PR cleanup harness self-test
        run: npm run test:cleanup-pr

      # npm run check は 20 個の検査を「全件実行してから失敗をまとめて報告」する
      # 集約ランナー。以前は && チェーンだったため、前方の 1 件が落ちると後続が
      # 一度も実行されず、1 回の CI で分かることが最初の失敗だけに縮んでいた
      # （PR #605 で check:learnings-index が初めてブロッキングになり、後続 6 件が
      # 未実行になった実例）。個々の検査の合否判定は変えていない。
      - name: Check Zenn content
        run: npm run check

      # publish-readiness ゲートの fixture self-test（hermetic・git 不要）。
      # 新設 check スクリプトの初版バグ対策（#393/#417 の再発防止）として常時実行する。
      - name: Publish readiness self-test
        run: npm run test:publish-readiness

      # zenn-pace ゲート自身の self-test（純関数 + 一時 git リポジトリによる hermetic テスト）。
      # 上と同じ趣旨（新設 check スクリプトの初版バグ対策・#393/#417 の再発防止）で常時実行する。
      # これを入れないと「rate-limit を見逃す変異」を CI が一度も検出できない（PR #553 レビュー M-2）。
      # ZENN_PACE_NO_FETCH=1: fixture は一時リポジトリなのでネットワーク fetch を抑止する。
      - name: Zenn publish pace self-test
        env:
          ZENN_PACE_NO_FETCH: '1'
        run: npm run test:zenn-pace

      # release/zenn 宛 PR のみ: この PR が release/zenn に新規に持ち込む published 数を
      # diff モード(BASE_REF)で直接計測し、二重公開(同一 deploy/24h で 2 記事)を STRICT で fatal 化する。
      # date モード(コミット日付)は「溜めてから sync」運用で見逃す/誤ブロックするため base 比較で計測する。
      - name: Zenn publish pace gate (release/zenn PRs only)
        if: github.event_name == 'pull_request' && github.base_ref == 'release/zenn'
        run: |
          git fetch origin "${{ github.base_ref }}"
          STRICT=1 BASE_REF="origin/${{ github.base_ref }}" npm run check:zenn-pace

      # release/zenn 宛 PR のみ: この PR で公開/更新される published:true 記事の
      # publish-readiness（/review-improve-loop の最終判定）を検証する（P5 ゲート）。
      # 段階導入のため STRICT なし（blocked=true でも WARN 止まり）。誤検知率を見て STRICT=1 に上げる。
      # 設計: docs/publish-readiness-gate-design.md
      - name: Publish readiness gate (release/zenn PRs only, WARN phase)
        if: github.event_name == 'pull_request' && github.base_ref == 'release/zenn'
        run: |
          git fetch origin "${{ github.base_ref }}"
          BASE_REF="origin/${{ github.base_ref }}" npm run check:publish-readiness

      - name: Generate content closed-loop note WXR (temporary preflight)
        run: |
          python3 -m pip install --disable-pip-version-check markdown
          python3 .claude/skills/note-export-import/scripts/md_to_wxr.py \
            articles_note/new/content-closed-loop-note.md \
            --out articles_note/build/import-content-closed-loop-note.xml

      - name: Structural preflight for generated WXR
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          path = Path("articles_note/build/import-content-closed-loop-note.xml")
          tree = ET.parse(path)
          root = tree.getroot()
          channel = root.find("channel")
          assert channel is not None, "channel missing"
          item = channel.find("item")
          assert item is not None, "item missing"

          ns = {
              "dc": "http://purl.org/dc/elements/1.1/",
              "wp": "http://wordpress.org/export/1.2/",
              "content": "http://purl.org/rss/1.0/modules/content/",
          }
          required = [
              "post_id", "post_date", "post_date_gmt",
              "post_modified", "post_modified_gmt",
              "comment_status", "ping_status", "post_name",
              "status", "post_parent", "menu_order",
              "post_type", "post_password", "is_sticky",
          ]
          missing = [name for name in required if item.find(f"wp:{name}", ns) is None]
          assert not missing, f"missing wp tags: {missing}"

          creator = item.find("dc:creator", ns)
          assert creator is not None and creator.text == "みね", f"unexpected dc:creator: {creator.text if creator is not None else None}"

          author_display = channel.find("wp:author/wp:author_display_name", ns)
          assert author_display is not None and author_display.text == "mine_unilabo", (
              f"unexpected author display/login: {author_display.text if author_display is not None else None}"
          )

          status = item.find("wp:status", ns)
          assert status is not None and status.text == "publish", f"unexpected wp:status: {status.text if status is not None else None}"

          content = item.find("content:encoded", ns)
          html = content.text if content is not None and content.text else ""
          assert "../assets/" not in html and "src=\"assets/" not in html, "local image reference remains"
          assert "<table" not in html, "unexpected table emitted"
          assert "AIに記事を書かせる前に" in (item.findtext("title") or ""), "title mismatch"
          assert "学びが戻る仕組み" in html, "body marker missing"

          print("[ok] WXR XML well-formed")
          print("[ok] required wp:* tags present")
          print("[ok] author fields match repository contract")
          print("[ok] no local image references")
          print("[ok] title/body marker present")
          PY

      - name: Upload content closed-loop WXR artifact
        uses: actions/upload-artifact@v4
        with:
          name: content-closed-loop-wxr
          path: articles_note/build/import-content-closed-loop-note.xml
          if-no-files-found: error
          retention-days: 7

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
